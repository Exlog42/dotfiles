[colors]
background = #262626
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880
i3blue = #285577 
i3gray = #222222
i3border = #333333
i3background = #000000
i3foreground = #ffffff
i3green = #13e014
bordercolor = #608f5b

[bar/main]
width = 100%
height = 15pt
bottom = true
radius = 0

dpi = 144

background = ${colors.background}
foreground = ${colors.i3foreground}

underline-size = 0pt

border-size = 1pt
border-color = ${colors.bordercolor}

padding-left = 1
padding-right = 0

module-margin = 0.5

separator = |
separator-foreground = ${colors.disabled}

font-0 = GohuFont 14 Nerd Font Propo:size=13;5

modules-left = xworkspaces wlanspeed 
modules-right = filesystem brightness pulseaudio memory cpu redshift battery timer date systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = i3

; override-redirect = true


; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 4pt
tray-size = 70%


[module/xworkspaces]
type = internal/xworkspaces

icon-0 = 0;0
icon-1 = 1;
icon-2 = 2;
icon-3 = 3;
icon-4 = 4;
icon-5 = 5;
icon-6 = 6;󰭹
icon-7 = 7;󰊗
icon-8 = 8;8
icon-9 = 9;9

label-active = %icon% 
; label-active-background = ${colors.secondary}
label-active-foreground = ${colors.i3green}
label-active-underline= ${colors.i3blue}
label-active-padding = 1

label-occupied = %icon%
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /
mount-1 = /home

label-mounted = %{F#13e014}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = custom/script
exec = ~/.config/polybar/scripts/volume_monitor.sh
tail = true

scroll-up = pactl set-sink-volume @DEFAULT_SINK@ -5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ +5%
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle

format = <label>
label = %output%

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.i3green}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.i3green}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

[module/wlanspeed]
type = internal/network
interface = wlp50s0f0 
interval = 2.0
; label-connected = %{F#13e014}D:%{F-} %downspeed:7% %{F#13e014}U:%{F-} %upspeed:7%
label-connected = %{F#13e014}%{F-} %downspeed:8% 
label-disconnected =  

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.i3foreground}

[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness_monitor.sh
tail = true
scroll-up = ~/.config/polybar/scripts/brightness_down.sh
scroll-down = brightnessctl set +1%

format = <label>
label = %{F#13e014}󰃠%{F-} %output%

[module/battery]
type = internal/battery
battery = BAT1 
adapter = ACAD 
full-at = 95 
low-at = 15

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
format-low = <label-low>

label-charging = %{F#13e014}󱊥%{F-} %percentage%%
label-discharging = %{F#13e014}%{F-} %percentage%%
label-full = %{F#13e014}%{F-} %percentage%%
label-low = %{F#13e014}%{F-} %percentage%%

[module/pomodoro]
type = custom/script
exec = python ~/.config/polybar/Pomodoro/pomodoro.py
interval = 1
format-foreground = ${colors.i3foreground}
label = %output%
click-left = python ~/.config/polybar/Pomodoro/pomodoro.py 2700
click-right = python ~/.config/polybar/Pomodoro/pomodoro.py 900

[module/timer]
type = custom/script
exec = ~/.config/polybar/scripts/timer.py
interval = 1
format-foreground = ${colors.i3foreground}
label = %output%
click-left = ~/.config/polybar/scripts/timer.py toggle
click-middle = ~/.config/polybar/scripts/timer.py start 25m
click-right = ~/.config/polybar/scripts/timer.py stop
scroll-up = ~/.config/polybar/scripts/timer.py add 1m
scroll-down = ~/.config/polybar/scripts/timer.py sub 1m

[module/redshift]
type = custom/script
exec = ~/.config/polybar/scripts/redshift.sh
tail = true
click-left =~/.config/polybar/scripts/redshift.sh toggle
format-foreground = ${colors.i3green}
label = %output%

[module/cava]
type = custom/script
tail = true
exec = $HOME/.config/polybar/scripts/cava.sh
format = <label>
format-font = 5
label-foreground = ${colors.i3green}
label = %output%

[module/spotify]
type = custom/script
tail = true
interval = 1
format-prefix = ""
format = <label>
format-foreground = ${colors.i3green}
exec = ~/.config/polybar/scripts/scroll_spotify_status.sh

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
