############################
#  Picom GLX 配置
############################

backend = "glx";
vsync = true;
use-damage = true;

############################
#  阴影
############################
shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.5;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'",
  "class_g = 'polybar'",
  "class_g = 'rofi'",
  "class_g = 'Dunst'",
];

############################
#  渐变
############################
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 4;

############################
#  透明
############################
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

############################
#  模糊
############################
blur-background = true;
blur-strength = 8;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'polybar'",
  "class_g = 'rofi'",
];

############################
#  圆角
############################
corner-radius = 0;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
];

############################
#  Wintypes
############################
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.85; focus = true; full-shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
  popup_menu = { shadow = false; };
  utility = { shadow = false; };
};
